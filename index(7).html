async function api(action,payload){if(shared){let res=await fetch('./api',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Token':token},body:JSON.stringify({action,payload})});let data=await res.json();if(!res.ok)throw Error(data.error||'Холболтын алдаа');return data.result}let db=read('mk-db',{rooms:{}}),r=Engine.act(db,action,payload,token);write('mk-db',db);return r}function remember(r){write(key(),[r.code,...read(key(),[]).filter(c=>c!==r.code)])}function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3000)}function err(s){let e=$('#error');if(e)e.textContent=s;else toast(s)}

function home(rs){content.innerHTML=hero('MK ARENA','Тэмцээнээ зохион байгуул. Багууд, хуваарь, оноо — нэг дор.')+`<div class="actions">${btn('＋ Тэмцээн үүсгэх','create','full')}${btn('Өрөөний кодоор нэгдэх','join','secondary full')}</div><div class="stats"><div>${rs.length}<small>Миний тэмцээн</small></div><div>${rs.filter(r=>r.isAdmin).length}<small>Удирдаж буй</small></div></div><div class="section"><h2>Миний тэмцээнүүд</h2></div>${rs.length?`<div class="grid">${rs.map(r=>`<article class="card stack"><div class="actions">${pill(r)}<span class="pill">${r.isAdmin?'Админ':'Хэрэглэгч'}</span></div><h2>${esc(r.name)}</h2><p>${r.teams.length} баг • ${fmt(r.start)}</p>${btn('Тэмцээнд орох →','room:'+r.code,'secondary full')}</article>`).join('')}</div>`:empty('Тэмцээн байхгүй','Шинэ тэмцээн үүсгэх эсвэл кодоор нэгдээрэй.')}`}
function create(){let d=Date.now();content.innerHTML=`<div class="card"><h2>Шинэ тэмцээн</h2><p>Үүсгэсэн хэрэглэгч тухайн тэмцээний админ болно.</p><form id="createForm"><div class="fields">${field('Тэмцээний нэр','name','text','','placeholder="Жишээ: Коосэн цом" maxlength="100"',true)}<div class="field full"><label for="venue">Байршил (заавал биш)</label><input id="venue" name="venue" placeholder="Спорт заал"></div>${field('Бүртгэл дуусах','deadline','datetime-local',local(d+86400000))}${field('Тэмцээн эхлэх','start','datetime-local',local(d+172800000))}<div class="field"><label for="zoneCount">Бүсийн тоо</label><select id="zoneCount" name="zoneCount">${Array.from({length:8},(_,i)=>`<option ${i===1?'selected':''}>${i+1}</option>`).join('')}</select></div>${field('Тоглолт хоорондын зай (мин)','minutes','number',60,'min="10" max="180"')}${field('Нэг үеийн хугацаа (мин)','periodMinutes','number',10,'min="1" max="20"')}</div><div class="notice">Бүртгэл хаагдсаны дараа багууд тэнцвэртэй, санамсаргүй бүсэд хуваагдаж тойргийн хуваарь үүснэ.</div><div class="error" id="error"></div><button class="btn full" type="submit">Тэмцээн үүсгэх →</button></form></div>`}

async function openRoom(code,t='overview'){active=await api('get',{code});remember(active);mode='room';tab=t;matchId=null;filter='all';renderRoom();window.scrollTo(0,0)}

function schedule(r){if(!r.generated)return empty('Хуваарь хараахан үүсээгүй','Бүртгэл хаагдаж дор хаяж 2 баг бүртгэгдсэн үед үүснэ.');let days=[...new Set(r.matches.map(m=>dayKey(m.time)))];let games=r.matches.filter(m=>filter==='all'||dayKey(m.time)===filter);return `<div class="section"><h2>Тоглолтын хуваарь</h2>${r.isAdmin?btn('＋ Нэмэх','addMatch','small'):''}</div><div class="days"><button class="day ${filter==='all'?'active':''}" data-action="day:all">Бүгд</button>${days.map(d=>`<button class="day ${filter===d?'active':''}" data-action="day:${d}"><small>${new Intl.DateTimeFormat('mn-MN',{weekday:'short'}).format(new Date(d+'T12:00'))}</small>${d.slice(5).replace('-','/')}</button>`).join('')}</div><div class="stack">${games.map(m=>game(r,m)).join('')||empty('Тоглолт байхгүй','Өөр өдөр сонгоно уу.')}</div>`}

function live(r){let m=r.matches.find(m=>m.id===matchId);if(!m)return `<div class="section"><h2>Тоглолт сонгох</h2>${btn('Үр дүн','tab:standings','secondary small')}</div><div class="stack">${r.matches.map(m=>game(r,m)).join('')||empty('Тоглолт байхгүй','Хуваарь үүсгэсний дараа оноо хөтөлнө.')}</div>`;let editable=r.isAdmin&&m.status!=='final';return `<div class="actions back">${btn('← Хуваарь','tab:schedule','secondary small')}<span class="pill ${m.status==='live'?'live':''}">${m.status==='final'?'Дууссан':m.status==='live'?'Явагдаж байна':'Товлогдсон'}</span></div><div class="scoreboard"><div class="versus"><div class="side">${crest(team(r,m.a))}<span>${teamName(r,m.a)}</span><div class="bigscore">${m.sa??0}</div></div><div></div><div class="side">${crest(team(r,m.b))}<span>${teamName(r,m.b)}</span><div class="bigscore">${m.sb??0}</div></div></div><div class="clock" id="clock">00:00</div><div class="period">${m.period>4?'Нэмэлт үе '+(m.period-4):['','I','II','III','IV'][m.period]+' үе'}</div></div>${editable?`<div class="pointgrid">${['sa','sb'].map((s,i)=>`<div><h3>${teamName(r,i?m.b:m.a)}</h3>${[1,2,3,-1].map(n=>`<button class="point" data-action="point:${s}:${n}">${n>0?'+':''}${n}</button>`).join('')}</div>`).join('')}</div><div class="controls">${btn(m.runningSince!==null?'Ⅱ Түр зогсоох':'▶ Цаг эхлүүлэх',m.runningSince!==null?'pause':'start','secondary')}${btn('Цаг засах','editClock','secondary')}${btn('Үе дуусгах','period')}${btn('Тоглолт дуусгах','finish','dark')}</div>`:''}${r.isAdmin?`<div class="actions score-form" style="margin-top:12px">${btn('Оноо засах','editScore','secondary full')}${m.status==='scheduled'?btn('Хуваарийн цаг засах','editTime','secondary full'):''}</div>`:'<div class="notice">Зөвхөн тэмцээний админ оноо болон цагийг удирдана.</div>'}`}

function standings(r){return `<div class="section"><h2>Бүсийн үр дүн</h2>${btn('Оноо хөтлөх','tab:live','secondary small')}</div><p>Хожил 2, хожигдол 1 оноо. Зөвхөн дууссан тоглолтыг тооцно.</p><div class="stack" style="margin-top:12px">${r.groups.map(g=>`<div class="card"><h3>${g.name} БҮС</h3><div class="tablewrap"><table><thead><tr><th>#</th><th>Баг</th><th>Т</th><th>Х</th><th>Хг</th><th>Зөрүү</th><th>Оноо</th></tr></thead><tbody>${Engine.standings(r,g).map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td><td>${t.played}</td><td>${t.w}</td><td>${t.l}</td><td>${t.pf-t.pa}</td><td><b>${t.pts}</b></td></tr>`).join('')}</tbody></table></div></div>`).join('')||empty('Үр дүн байхгүй','Бүс, хуваарь үүсэхэд энд харагдана.')}</div>`}
async function change(a,p={}){active=await api(a,{code:active.code,...p});renderRoom()}
async function action(a){if(['home','create','join'].includes(a))return go(a);if(a.startsWith('room:'))return openRoom(a.slice(5));if(a.startsWith('nav:')){let t=a.slice(4);if(active){tab=t;matchId=null;renderRoom();return}let codes=read(key(),[]);if(codes.length)return openRoom(codes[0],t);toast('Эхлээд тэмцээн үүсгэх эсвэл нэгдэнэ үү.');return}if(!active)return;if(a.startsWith('tab:')){active=await api('get',{code:active.code});tab=a.slice(4);matchId=null;renderRoom();return}if(a.startsWith('day:')){filter=a.slice(4);renderRoom();return}if(a.startsWith('match:')){matchId=a.slice(6);tab='live';renderRoom();window.scrollTo(0,0);return}if(a==='register'||a==='addTeam')return register(a==='addTeam');if(a==='addMatch')return addMatch();if(['editScore','editClock','editTime'].includes(a))return edit(a);if(a==='copy'){try{await navigator.clipboard.writeText(active.code);toast('Код хууллаа.')}catch{window.prompt('Өрөөний код:',active.code)}return}if(a==='close'){if(confirm('Бүртгэлийг одоо хааж хуваарь үүсгэх үү?')){await change('close');toast('Хуваарь үүслээ.')}return}if(a.startsWith('point:')){let [,side,delta]=a.split(':');return change('point',{id:matchId,side,delta:Number(delta)})}if(['start','pause','period','finish'].includes(a)){if(['period','finish'].includes(a)&&!confirm(a==='period'?'Энэ үеийг дуусгах уу?':'Тоглолтыг дуусгах уу?'))return;return change(a,{id:matchId})}}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b||busy)return;busy=true;try{await action(b.dataset.action)}catch(e){err(e.message)}finally{busy=false}});document.addEventListener('submit',async e=>{let f=e.target;if(!f.matches('form'))return;e.preventDefault();if(busy)return;busy=true;let d=Object.fromEntries(new FormData(f)),b=f.querySelector('button:not([type=button])');if(b)b.disabled=true;try{if(f.id==='createForm'){d.start=new Date(d.start).toISOString();d.deadline=new Date(d.deadline).toISOString();active=await api('create',d);remember(active);mode='room';tab='overview';renderRoom();toast('Тэмцээн үүслээ.')}else if(f.id==='joinForm'){await openRoom(d.code.trim().toUpperCase());toast('Тэмцээнд нэгдлээ.')}else if(f.id==='registerForm'){active=await api(f.dataset.admin==='yes'?'addTeam':'register',{...d,members:d.members.split(/\r?\n/),code:active.code});tab='teams';renderRoom();toast('Баг бүртгэгдлээ.')}else if(f.id==='matchForm'){active=await api('addMatch',{...d,time:new Date(d.time).toISOString(),code:active.code});tab='schedule';renderRoom();toast('Тоглолт нэмэгдлээ.')}else if(f.id==='editForm'){let kind=f.dataset.kind;if(d.time)d.time=new Date(d.time).toISOString();await change(kind==='editClock'?'clock':kind,{...d,id:matchId});toast('Хадгаллаа.')}}catch(e){err(e.message)}finally{busy=false;if(b)b.disabled=false}});
async function init(){if(location.protocol!=='file:'){try{let r=await fetch('./api/health',{cache:'no-store'});shared=r.ok&&(await r.json()).shared===true}catch{}}$('#mode').innerHTML=shared?'<b>● Онлайн</b>Хамтын өрөө':'<b>● Дотоод</b>Энэ төхөөрөмж';await go('home')}
setInterval(updateClock,250);setInterval(async()=>{if(!active||busy||content.querySelector('form'))return;let old=active;try{let r=await api('get',{code:old.code});if(active===old&&JSON.stringify(r)!==JSON.stringify(old)){active=r;renderRoom()}}catch{}},4000);init().catch(e=>{content.textContent='Алдаа: '+e.message});})();
</script></body></html>
