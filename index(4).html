</style></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="#home"><span class="logo">MK<span>.</span></span><span>ARENA<small>TOURNAMENT MANAGER</small></span></a><div class="nav-caption">ЦЭС</div><button class="nav active" data-go="home"><span>▦</span> Нүүр хуудас</button><button class="nav" data-go="create"><span>＋</span> Тэмцээн үүсгэх</button><button class="nav" data-go="join"><span>↪</span> Кодoор нэгдэх</button><div class="side-bottom"><span class="ball">🏀</span><div>Сагсан бөмбөг<small>Тэмцээний удирдлага</small></div></div></aside><main><header><div><span class="eyebrow">MK / BASKETBALL</span><h1 id="title">Тэмцээний төв</h1></div><div class="mode" id="mode"><i></i> Холбогдож байна</div></header><div id="content" aria-live="polite"></div></main></div><div id="toast" role="status"></div><script>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.Engine=factory()})(globalThis,function(){
 const clean=(v,max=100)=>String(v??'').trim().slice(0,max), fail=m=>{throw Error(m)}, now=()=>Date.now(), uid=()=>Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2), alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 function code(db){let c;do{c=Array.from({length:6},()=>alphabet[Math.floor(Math.random()*alphabet.length)]).join('')}while(db.rooms[c]);return c}
 function room(db,c){let r=db.rooms[clean(c,10).toUpperCase()];if(!r)fail('Тэмцээний код олдсонгүй.');return r}
 function date(v){let n=Date.parse(v);if(!Number.isFinite(n))fail('Огноо, цагийг зөв оруулна уу.');return n}
 function makeSchedule(r){if(r.generated||now()<r.deadline||r.teams.length<2)return false;let teams=[...r.teams];for(let i=teams.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[teams[i],teams[j]]=[teams[j],teams[i]]}let count=Math.min(r.zoneCount,Math.floor(teams.length/2)), groups=Array.from({length:count},(_,i)=>({name:String.fromCharCode(65+i),ids:[]}));teams.forEach((t,i)=>groups[i%count].ids.push(t.id));let queues=groups.map(g=>{let a=g.ids.slice();if(a.length%2)a.push(null);let rounds=[];for(let k=0;k<a.length-1;k++){let games=[];for(let j=0;j<a.length/2;j++){let x=a[j],y=a[a.length-1-j];if(x&&y)games.push({id:uid(),zone:g.name,round:k+1,a:x,b:y,sa:null,sb:null})}rounds.push(games);a.splice(1,0,a.pop())}return rounds});let games=[];for(let k=0;k<Math.max(...queues.map(q=>q.length));k++){for(let g=0;g<queues.length;g++)games.push(...(queues[g][k]||[]))}games.forEach((m,i)=>m.time=r.start+i*r.minutes*60000);r.groups=groups;r.matches=games;r.generated=true;return true}
 function view(r,token){return {code:r.code,name:r.name,venue:r.venue,start:r.start,deadline:r.deadline,zoneCount:r.zoneCount,minutes:r.minutes,generated:r.generated,groups:r.groups,matches:r.matches,teams:r.teams.map(({owner,...t})=>t),isAdmin:r.owner===token,myTeam:r.teams.find(t=>t.owner===token)?.id||null,closed:now()>=r.deadline}}
 function act(db,action,p,token){if(!/^[a-f0-9]{32,128}$/.test(token||''))fail('Хэрэглэгчийн таних мэдээлэл буруу.');p=p||{};if(action==='create'){let name=clean(p.name,100),venue=clean(p.venue,100),start=date(p.start),deadline=date(p.deadline),zoneCount=Number(p.zoneCount),minutes=Number(p.minutes);if(!name)fail('Тэмцээний нэр оруулна уу.');if(deadline<=now()||start<deadline)fail('Бүртгэл дуусах цаг ирээдүйд, тэмцээн эхлэхээс өмнө байна.');if(!Number.isInteger(zoneCount)||zoneCount<1||zoneCount>8)fail('Бүсийн тоо 1–8 байна.');if(!Number.isInteger(minutes)||minutes<10||minutes>180)fail('Тоглолтын хугацаа 10–180 минут байна.');let c=code(db),r={code:c,name,venue,start,deadline,zoneCount,minutes,owner:token,teams:[],groups:[],matches:[],generated:false};db.rooms[c]=r;return view(r,token)}
 let r=room(db,p.code);makeSchedule(r);if(action==='get')return view(r,token);if(action==='register'){if(now()>=r.deadline)fail('Бүртгэл дууссан.');if(r.teams.some(t=>t.owner===token))fail('Энэ хэрэглэгч аль хэдийн баг бүртгүүлсэн.');let name=clean(p.name,80),captain=clean(p.captain,80),members=Array.isArray(p.members)?p.members.map(v=>clean(v,80)).filter(Boolean):[];if(!name||!captain||!members.length)fail('Багийн нэр, ахлагч, гишүүдийг бүрэн оруулна уу.');if(members.length>30)fail('Гишүүдийн тоо 30-аас ихгүй байна.');if(r.teams.length>=128)fail('Багийн дээд тоо 128.');if(r.teams.some(t=>t.name.toLowerCase()===name.toLowerCase()))fail('Ийм нэртэй баг бүртгэгдсэн байна.');r.teams.push({id:uid(),name,captain,members,owner:token});return view(r,token)}
 if(r.owner!==token)fail('Зөвхөн тухайн тэмцээний админ энэ үйлдлийг хийнэ.');if(action==='score'){let m=r.matches.find(m=>m.id===p.id);if(!m)fail('Тоглолт олдсонгүй.');let a=Number(p.sa),b=Number(p.sb);if(p.sa===''||p.sb===''||p.sa==null||p.sb==null||!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>999||b>999||a===b)fail('0–999 хооронд ялгаатай бүхэл оноо оруулна уу.');m.sa=a;m.sb=b;return view(r,token)}if(action==='generate'){if(now()<r.deadline)fail('Бүртгэл хараахан дуусаагүй.');if(r.teams.length<2)fail('Дор хаяж 2 баг шаардлагатай.');makeSchedule(r);return view(r,token)}fail('Танигдаагүй үйлдэл.');}
 function standings(r,g){let stats=g.ids.map(id=>({id,name:r.teams.find(t=>t.id===id)?.name||'?',played:0,w:0,l:0,pf:0,pa:0,pts:0}));let map=Object.fromEntries(stats.map(t=>[t.id,t]));r.matches.filter(m=>m.zone===g.name&&m.sa!==null&&m.sb!==null).forEach(m=>{let a=map[m.a],b=map[m.b];a.played++;b.played++;a.pf+=m.sa;a.pa+=m.sb;b.pf+=m.sb;b.pa+=m.sa;if(m.sa>m.sb){a.w++;a.pts+=2;b.l++;b.pts++}else{b.w++;b.pts+=2;a.l++;a.pts++}});return stats.sort((a,b)=>b.pts-a.pts||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf||a.name.localeCompare(b.name))}
 return {act,standings};
});
</script><script>(()=>{'use strict';const $=s=>document.querySelector(s),content=$('#content'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),fmt=n=>new Intl.DateTimeFormat('mn-MN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(n)),short=n=>new Intl.DateTimeFormat('mn-MN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(n)),local=n=>{let d=new Date(n);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}, token=read('mk-token',null)||Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');write('mk-token',token);let shared=false,mode='home',active=null,tab='overview',busy=false,toastTimer;const key=()=>shared?'mk-rooms-online':'mk-rooms-local';
async function api(action,payload){if(shared){let res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Token':token},body:JSON.stringify({action,payload})});let data=await res.json();if(!res.ok)throw Error(data.error||'Холболтын алдаа');return data.result}let db=read('mk-db',{rooms:{}}),r=Engine.act(db,action,payload,token);write('mk-db',db);return r}
function remember(r){let entries=read(key(),[]);entries=entries.filter(c=>c!==r.code);entries.unshift(r.code);write(key(),entries)}function toast(s){let el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}function error(s){let e=$('#error');if(e)e.textContent=s;else toast(s)}
const empty=(title,desc,icon='🏀')=>`<div class="empty"><div class="big">${icon}</div><h3>${title}</h3><div class="mini">${desc}</div></div>`, btn=(text,action,cls='')=>`<button type="button" class="btn ${cls}" data-action="${action}">${text}</button>`, pill=r=>`<span class="pill ${r.closed?'closed':'open'}">${r.closed?'Бүртгэл дууссан':'Бүртгэл нээлттэй'}</span>`,role=r=>r.isAdmin?'Админ':'Хэрэглэгч';
function head(t){$('#title').textContent=t;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.go===mode))}
async function go(m){mode=m;active=null;tab='overview';head(({home:'Тэмцээний төв',create:'Тэмцээн үүсгэх',join:'Тэмцээнд нэгдэх'})[m]);if(m==='home'){content.innerHTML='<div class="loading">Тэмцээнүүдийг уншиж байна…</div>';let codes=read(key(),[]),rs=await Promise.all(codes.map(code=>api('get',{code}).catch(()=>null)));if(mode!=='home')return;renderHome(rs.filter(Boolean))}else if(m==='create')renderCreate();else renderJoin();window.scrollTo(0,0)}
function renderHome(rs){content.innerHTML=`<section class="hero"><div class="hero-content"><div class="hero-label">ТОГЛОЛТ ЭНДЭЭС ЭХЭЛНЭ</div><h2>Тэмцээнээ нэг дор удирд.</h2><p>Баг бүртгэл, бүсийн хуваарилалт, тоглолтын хуваарь, үр дүнг нэг дороос хянаарай.</p><div class="actions">${btn('＋ Тэмцээн үүсгэх','create')}${btn('Кодоор нэгдэх','join','dark')}</div></div><div class="hero-ball">🏀</div></section><div class="grid"><div class="card"><div class="mini">Миний тэмцээн</div><div class="stat">${rs.length}</div></div><div class="card"><div class="mini">Миний удирдаж буй</div><div class="stat">${rs.filter(r=>r.isAdmin).length}</div></div><div class="card"><div class="mini">Нээлттэй бүртгэл</div><div class="stat">${rs.filter(r=>!r.closed).length}</div></div></div><div class="section-head"><h2>Миний тэмцээнүүд</h2>${btn('＋ Шинэ','create','secondary small')}</div>${rs.length?`<div class="grid">${rs.map(r=>`<article class="card room-card"><div class="actions">${pill(r)}<span class="pill">${role(r)}</span></div><div class="card-title">${esc(r.name)}</div><div class="mini">🏀 ${r.teams.length} баг · ${fmt(r.start)}</div>${btn('Өрөөнд орох →','room:'+r.code,'secondary')}</article>`).join('')}</div>`:empty('Одоогоор тэмцээн байхгүй','Тэмцээн үүсгэх эсвэл өрөөний кодоор нэгдээрэй.')}`}
function field(label,name,type='text',value='',extra='',full=false){return `<div class="field ${full?'full':''}"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra} required></div>`}
function renderCreate(){let d=Date.now();content.innerHTML=`<div class="card form-card"><h2>Шинэ сагсан бөмбөгийн тэмцээн</h2><p>Тэмцээн үүсгэснээр та тухайн өрөөний админ болно.</p><form id="createForm"><div class="fields">${field('Тэмцээний нэр','name','text','','maxlength="100" placeholder="Жишээ: MK Cup 2026"',true)}<div class="field full"><label for="venue">Байршил (заавал биш)</label><input id="venue" name="venue" maxlength="100" placeholder="Спорт заалны нэр"></div>${field('Бүртгэл дуусах огноо, цаг','deadline','datetime-local',local(d+86400000))}${field('Тэмцээн эхлэх огноо, цаг','start','datetime-local',local(d+172800000))}<div class="field"><label for="zoneCount">Бүсийн тоо</label><select id="zoneCount" name="zoneCount">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${i===1?'selected':''}>${i+1} бүс</option>`).join('')}</select></div>${field('Нэг тоглолтын зай (минут)','minutes','number',60,'min="10" max="180"')}</div><div class="notice">Бүртгэл дуусмагц багууд санамсаргүй, тэнцвэртэй бүсэд хуваагдаж, бүс дотроо тойргийн журмаар тоглоно. Баг цөөн бол бүсийн тоог автоматаар багасгана.</div><div id="error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Тэмцээн үүсгэх →</button>${btn('Буцах','home','secondary')}</div></form></div>`}
function renderJoin(){content.innerHTML=`<div class="card form-card"><h2>Өрөөний кодоор нэгдэх</h2><p>Тэмцээний админаас авсан 6 тэмдэгттэй кодыг оруулна уу.</p><form id="joinForm"><div class="fields">${field('Тэмцээний код','code','text','','maxlength="6" minlength="6" placeholder="AB12CD" style="text-transform:uppercase;letter-spacing:5px;font-weight:800"',true)}</div><div id="error" class="error" role="alert"></div><button class="btn" type="submit">Өрөөнд нэвтрэх →</button></form></div>`}
async function openRoom(code,nextTab='overview'){let r=await api('get',{code});remember(r);mode='room';active=r;tab=nextTab;head('Тэмцээний өрөө');renderRoom();window.scrollTo(0,0)}
function renderRoom(){let r=active;if(!r)return;let tabs=[['overview','Ерөнхий'],['teams','Багууд'],['schedule','Хуваарь'],['scoreboard','Онооны хүснэгт']];content.innerHTML=`<div class="back">${btn('← Миний тэмцээнүүд','home','secondary small')}</div><section class="room-top"><div><div class="actions"><span class="hero-label">САГСАН БӨМБӨГ</span><span class="subtle">${role(r)}</span></div><h2>${esc(r.name)}</h2><p>${fmt(r.start)}${r.venue?' · '+esc(r.venue):''}</p>${pill(r)}</div><div class="code-box"><span class="subtle">ӨРӨӨНИЙ КОД</span><strong>${r.code}</strong>${btn('Код хуулах','copy','dark small')}</div></section><div class="grid"><div class="card"><div class="mini">Бүртгүүлсэн баг</div><div class="stat">${r.teams.length}</div></div><div class="card"><div class="mini">Бүс</div><div class="stat">${r.generated?r.groups.length:r.zoneCount}</div></div><div class="card"><div class="mini">Тоглолт</div><div class="stat">${r.matches.filter(m=>m.sa!==null).length}<span class="mini"> / ${r.matches.length}</span></div></div></div><div class="tabs">${tabs.map(([k,v])=>`<button class="tab ${k===tab?'active':''}" data-action="tab:${k}">${v}</button>`).join('')}</div><div id="panel">${({overview,teams,schedule,scoreboard})[tab](r)}</div>`}
function overview(r){return `<div class="split"><div class="card"><h2>Тэмцээний мэдээлэл</h2><p>Бүртгэл дуусах: <strong>${fmt(r.deadline)}</strong></p><p>Эхлэх: <strong>${fmt(r.start)}</strong></p><p>Байршил: <strong>${esc(r.venue||'Тодорхойгүй')}</strong></p><p>Нэг тоглолтын зай: <strong>${r.minutes} минут</strong></p>${r.closed?`<div class="notice">${r.generated?'Бүс, хуваарь үүссэн.':'Бүртгэл хаагдсан. Хуваарь үүсэхэд дор хаяж 2 баг шаардлагатай.'}</div>`:`<div class="notice">Бүртгэл дууссаны дараа хуваарь автоматаар үүснэ.</div>`}${btn('Тоглолтын хуваарь','tab:schedule','secondary')}${r.isAdmin&&r.closed&&!r.generated?btn('Хуваарь үүсгэх','generate','secondary'):''}</div><div class="card"><h2>${r.myTeam?'Миний баг':'Баг бүртгүүлэх'}</h2>${r.myTeam?`<p>Та <strong>${esc(r.teams.find(t=>t.id===r.myTeam)?.name)}</strong> багийг амжилттай бүртгүүлсэн.</p>${btn('Багууд харах','tab:teams','secondary')}`:r.closed?'<p>Бүртгэл дууссан тул шинэ баг бүртгэх боломжгүй.</p>':`<p>Багийн нэр, ахлагч болон гишүүдийн нэрийг оруулж бүртгүүлээрэй.</p>${btn('＋ Баг бүртгүүлэх','register')}`}</div></div>`}
function teams(r){let zone=id=>r.groups.find(g=>g.ids.includes(id))?.name;return `<div class="section-head"><h2>Бүртгэлтэй багууд (${r.teams.length})</h2>${!r.closed&&!r.myTeam?btn('＋ Баг бүртгэх','register','small'):''}</div>${r.teams.length?`<div class="stack">${r.teams.map(t=>`<div class="card team"><div class="team-icon">🏀</div><div class="team-info"><h3>${esc(t.name)}</h3><div class="mini">Ахлагч: ${esc(t.captain)} · ${t.members.length} гишүүн</div><details><summary>Гишүүд харах</summary><ul>${t.members.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></details></div>${zone(t.id)?`<span class="pill">${zone(t.id)} бүс</span>`:''}${t.id===r.myTeam?'<span class="pill open">Миний баг</span>':''}</div>`).join('')}</div>`:empty('Баг бүртгэгдээгүй','Бүртгэлтэй багууд энд харагдана.')}`}
function register(){let r=active;if(!r||r.closed||r.myTeam)return;$('#panel').innerHTML=`<div class="card form-card"><h2>Багийн бүртгэл</h2><p>Гишүүн бүрийн нэрийг тусдаа мөрөнд бичээрэй.</p><form id="registerForm"><div class="fields">${field('Багийн нэр','name','text','','maxlength="80" placeholder="Багийн нэр"',true)}${field('Багийн ахлагч','captain','text','','maxlength="80" placeholder="Ахлагчийн нэр"',true)}<div class="field full"><label for="members">Багийн гишүүд</label><textarea id="members" name="members" required placeholder="Гишүүн 1&#10;Гишүүн 2&#10;Гишүүн 3"></textarea><span class="hint">Ахлагч тоглогч бол гишүүдийн жагсаалтад мөн бичнэ үү. Зөвшөөрөлгүй хувийн мэдээлэл бүү оруул.</span></div></div><div id="error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Бүртгэл баталгаажуулах</button>${btn('Болих','tab:overview','secondary')}</div></form></div>`}
function schedule(r){if(!r.generated)return empty('Хуваарь хараахан үүсээгүй',r.closed?'Хуваарьт дор хаяж 2 баг шаардлагатай.':'Бүртгэл дуусмагц тоглолтууд энд автоматаар гарна.','📅');let name=id=>esc(r.teams.find(t=>t.id===id)?.name||'?');return `<div class="section-head"><h2>Тоглолтын хуваарь (${r.matches.length})</h2><span class="mini">1 талбай · тойргийн тоглолт</span></div><div class="stack">${r.matches.map((m,i)=>`<article class="card match"><div><span class="pill">${m.zone} бүс · ${m.round}-р тойрог</span><div class="mini" style="margin-top:7px">#${i+1} · ${short(m.time)}</div></div><div class="match-sides"><span class="match-team">${name(m.a)}</span><span class="score-display">${m.sa===null?'VS':m.sa+' : '+m.sb}</span><span class="match-team">${name(m.b)}</span></div>${r.isAdmin?`<form class="scoreform" data-match="${m.id}"><input class="scoreinput" name="sa" aria-label="${name(m.a)} оноо" type="number" min="0" max="999" value="${m.sa??''}" required><span>:</span><input class="scoreinput" name="sb" aria-label="${name(m.b)} оноо" type="number" min="0" max="999" value="${m.sb??''}" required><button class="btn small" type="submit">Хадгалах</button></form>`:`<span class="pill ${m.sa===null?'':'open'}">${m.sa===null?'Товлогдсон':'Дууссан'}</span>`}</article>`).join('')}</div>`}
function scoreboard(r){if(!r.generated)return empty('Онооны хүснэгт үүсээгүй','Бүсүүд үүссэний дараа онооны хүснэгт харагдана.','🏆');return `<div class="section-head"><h2>Бүсийн онооны хүснэгт</h2></div><p>Хожил = 2 оноо · Хожигдол = 1 оноо · Тэнцүү үед онооны зөрүү, авсан оноогоор эрэмбэлнэ.</p><div class="stack">${r.groups.map(g=>`<div class="card"><h3>${g.name} БҮС</h3><div class="table-wrap"><table class="scoretable"><thead><tr><th>#</th><th>Баг</th><th>Тоглосон</th><th>Хожил</th><th>Хожигдол</th><th>Авсан</th><th>Алдсан</th><th>Зөрүү</th><th>Оноо</th></tr></thead><tbody>${Engine.standings(r,g).map((t,i)=>`<tr><td>${i+1}</td><td><strong>${esc(t.name)}</strong></td><td>${t.played}</td><td>${t.w}</td><td>${t.l}</td><td>${t.pf}</td><td>${t.pa}</td><td>${t.pf-t.pa>0?'+':''}${t.pf-t.pa}</td><td class="rank">${t.pts}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div>`}
async function action(a){if(['home','create','join'].includes(a))return go(a);if(a.startsWith('room:'))return openRoom(a.slice(5));if(a.startsWith('tab:')){active=await api('get',{code:active.code});tab=a.slice(4);renderRoom();return}if(a==='register')return register();if(a==='copy'){try{await navigator.clipboard.writeText(active.code);toast('Код хууллаа.')}catch{window.prompt('Өрөөний кодыг хуулна уу:',active.code)}return}if(a==='generate'){active=await api('generate',{code:active.code});renderRoom();toast('Хуваарь үүссэн.')}}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action],[data-go]');if(!b||busy)return;busy=true;try{await action(b.dataset.action||b.dataset.go)}catch(e){error(e.message)}finally{busy=false}});$('.brand').addEventListener('click',e=>{e.preventDefault();go('home')});
document.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;let f=e.target, d=Object.fromEntries(new FormData(f)),submit=f.querySelector('button[type=submit],button:not([type])');if(submit)submit.disabled=true;try{if(f.id==='createForm'){d.start=new Date(d.start).toISOString();d.deadline=new Date(d.deadline).toISOString();active=await api('create',d);remember(active);mode='room';tab='overview';head('Тэмцээний өрөө');renderRoom();toast('Тэмцээн амжилттай үүслээ.')}else if(f.id==='joinForm'){await openRoom(d.code.trim().toUpperCase());toast('Өрөөнд нэгдлээ.')}else if(f.id==='registerForm'){active=await api('register',{...d,members:d.members.split(/\r?\n/),code:active.code});tab='teams';renderRoom();toast('Баг амжилттай бүртгэгдлээ.')}else if(f.dataset.match){active=await api('score',{...d,code:active.code,id:f.dataset.match});renderRoom();toast('Оноо хадгалагдлаа.')}}catch(e){error(e.message)}finally{busy=false;if(submit)submit.disabled=false}});
async function init(){if(location.protocol!=='file:'){try{let res=await fetch('/api/health',{cache:'no-store'});shared=res.ok&&(await res.json()).shared===true}catch{}}let el=$('#mode');el.classList.toggle('shared',shared);el.innerHTML=`<i></i> ${shared?'Онлайн · хамтын өрөө':'Дотоод хадгалалт'}`;await go('home')}
setInterval(async()=>{if(mode!=='room'||!active||busy||$('#registerForm')||content.contains(document.activeElement)&&document.activeElement.matches('input,textarea,select'))return;let previous=active;try{let next=await api('get',{code:previous.code});if(mode==='room'&&active===previous&&JSON.stringify(next)!==JSON.stringify(previous)){active=next;renderRoom()}}catch{}},8000);init().catch(e=>{content.textContent='Апп ачаалахад алдаа гарлаа: '+e.message});})();
</script></body></html>
